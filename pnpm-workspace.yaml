packages:
  - "apps/*"
  - "packages/*"
  - "packages/templates/*"

# These packages ship native binaries or run symlink hydration in postinstall.
# pnpm blocks build scripts by default; without these, `embedded-postgres`
# installs with no usable PG binaries and argon2/prisma fail at runtime.
allowBuilds:
  "@embedded-postgres/darwin-arm64": true
  "@embedded-postgres/darwin-x64": true
  "@embedded-postgres/linux-x64": true
  "@embedded-postgres/linux-arm64": true
  "@prisma/client": true
  "@prisma/engines": true
  prisma: true
  argon2: true
  esbuild: true
  "@tailwindcss/oxide": true
  unrs-resolver: true
  sharp: true
  # Native msgpack accelerator for BullMQ; falls back to JS if unbuilt.
  msgpackr-extract: true
  # Analytics phone-home. Declined.
  "@scarf/scarf": false
  "@embedded-postgres/windows-x64": true
